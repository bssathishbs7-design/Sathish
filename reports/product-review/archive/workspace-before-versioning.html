s; document responsive and accessible behaviour.\u003c/li>\u003cli>Validate prototypes with users and supply implementation-ready interaction specifications.\u003c/li>\u003c/ul>\u003ch3>Expected evidence\u003c/h3>\u003cul>\u003cli>Journey maps, wireframes and prototype references\u003c/li>\u003cli>Component/state inventory and design specifications\u003c/li>\u003cli>Usability findings and accessibility criteria\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Handoff gate:\u003c/strong> Approved flows and states cover the acceptance criteria; assets and component behaviour are available to Engineering and QA.\u003c/p>\u003cp>\u003cstrong>Readiness:\u003c/strong> evidence not collected; capacity, dates, budget and tool selection not confirmed.\u003c/p>"},{"title":"Engineering & Dev","html":"\u003csummary>Responsibilities and deliverables\u003c/summary>\u003ch3>Work checklist\u003c/h3>\u003cul>\u003cli>Map frontend state, mock services, API contracts and documented data shapes.\u003c/li>\u003cli>Define backend persistence, authentication, permissions, institution boundaries and migrations.\u003c/li>\u003cli>Review source-control workflow, code ownership, peer review and branch protections.\u003c/li>\u003cli>Define CI build, lint, test and deployment gates; separate environments and configuration.\u003c/li>\u003cli>Document dependency, security, performance, observability, rollout and rollback requirements.\u003c/li>\u003c/ul>\u003ch3>Expected evidence\u003c/h3>\u003cul>\u003cli>Technical design and API contracts\u003c/li>\u003cli>Reviewed source changes and pipeline evidence\u003c/li>\u003cli>Environment, deployment and rollback runbooks\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Handoff gate:\u003c/strong> Changes satisfy agreed scope and contracts; required checks pass in a named environment. Handoff to QA and Operations. No implementation is performed by this report.\u003c/p>\u003cp>\u003cstrong>Readiness:\u003c/strong> evidence not collected; capacity, dates, budget and tool selection not confirmed.\u003c/p>"},{"title":"Quality & Testing","html":"\u003csummary>Responsibilities and deliverables\u003c/summary>\u003ch3>Work checklist\u003c/h3>\u003cul>\u003cli>Map every requirement to role-based test cases and expected results.\u003c/li>\u003cli>Define supported browsers/devices and check responsive layout, accessibility and keyboard flows.\u003c/li>\u003cli>Validate API contracts, errors, authentication, authorisation and data integrity.\u003c/li>\u003cli>Cover unit, integration, end-to-end, regression and smoke tests as appropriate.\u003c/li>\u003cli>Test negative paths, duplicate submissions, stale records, interrupted sessions and recovery; capture reproducible defects.\u003c/li>\u003c/ul>\u003ch3>Expected evidence\u003c/h3>\u003cul>\u003cli>Traceability matrix and browser/device coverage\u003c/li>\u003cli>Test cases, automation reports and defect evidence\u003c/li>\u003cli>Release quality recommendation and outstanding-risk list\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Handoff gate:\u003c/strong> Critical journeys pass against acceptance criteria; unresolved defects and exceptions have explicit owners and release decisions.\u003c/p>\u003cp>\u003cstrong>Readiness:\u003c/strong> evidence not collected; capacity, dates, budget and tool selection not confirmed.\u003c/p>"},{"title":"Operations & Support","html":"\u003csummary>Responsibilities and deliverables\u003c/summary>\u003ch3>Work checklist\u003c/h3>\u003cul>\u003cli>Define error tracking, alerts, triage, incident severity and escalation ownership.\u003c/li>\u003cli>Prepare release health checks, rollback decisions, recovery and incident communication.\u003c/li>\u003cli>Organise help-desk intake, ticket categories, response targets and resolution knowledge.\u003c/li>\u003cli>Collect customer feedback with privacy-aware evidence and link recurring issues to the backlog.\u003c/li>\u003cli>Track support trends and incident follow-up; distinguish defects, training needs and enhancements.\u003c/li>\u003c/ul>\u003ch3>Expected evidence\u003c/h3>\u003cul>\u003cli>Monitoring and incident-response checklist\u003c/li>\u003cli>Help-desk workflow, knowledge base and escalation matrix\u003c/li>\u003cli>Customer-feedback register and operational review\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Handoff gate:\u003c/strong> Support has release notes and known issues; incident owners, monitoring and recovery paths are confirmed. Feedback returns to Product Management.\u003c/p>\u003cp>\u003cstrong>Readiness:\u003c/strong> evidence not collected; capacity, dates, budget and tool selection not confirmed.\u003c/p>"},{"title":"Communication","html":"\u003csummary>Responsibilities and deliverables\u003c/summary>\u003ch3>Work checklist\u003c/h3>\u003cul>\u003cli>Define audience, channel, cadence and owner for each update.\u003c/li>\u003cli>Maintain asynchronous progress, blockers, decisions and change summaries.\u003c/li>\u003cli>Use synchronous reviews for unresolved decisions, planning, demos and retrospectives; record outcomes.\u003c/li>\u003cli>Prepare customer updates and release notes with confirmed scope, limitations and support guidance.\u003c/li>\u003cli>Record decision approvals and acknowledgement of handoffs; avoid unsupported delivery promises.\u003c/li>\u003c/ul>\u003ch3>Expected evidence\u003c/h3>\u003cul>\u003cli>Communication plan and decision log\u003c/li>\u003cli>Status updates, meeting outcomes and release-note drafts\u003c/li>\u003cli>Customer-update review and approval record\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Handoff gate:\u003c/strong> Relevant stakeholders understand scope, decisions, ownership and next steps. Customer-facing messages are reviewed before sending; this report sends nothing.\u003c/p>\u003cp>\u003cstrong>Readiness:\u003c/strong> evidence not collected; capacity, dates, budget and tool selection not confirmed.\u003c/p>"},{"title":"Lifecycle handoffs","html":"\u003ch2>Product lifecycle and team handoffs\u003c/h2>\u003cp>A proposed sequence for coordinated delivery. Every gate below still needs evidence and an agreed owner; no release or budget is authorised by this list.\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Product lifecycle handoffs\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Stage\u003c/th>\u003cth scope=\"col\">Lead function\u003c/th>\u003cth scope=\"col\">Required handoff\u003c/th>\u003cth scope=\"col\">Cross-team check\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">1. Discover\u003c/th>\u003ctd>Product Management + UX research\u003c/td>\u003ctd>Problem, user evidence, outcomes and constraints\u003c/td>\u003ctd>Lead BA records ambiguous rules and decision owners.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">2. Define and prioritise\u003c/th>\u003ctd>Product Management + Lead BA\u003c/td>\u003ctd>Scope baseline, backlog, acceptance criteria and roadmap\u003c/td>\u003ctd>Engineering estimates feasibility; QA checks testability; budget assumptions remain explicit.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">3. Design\u003c/th>\u003ctd>UX/UI Design\u003c/td>\u003ctd>Prototype, component states and responsive specifications\u003c/td>\u003ctd>Product validates intent; Engineering and QA review feasibility and coverage.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">4. Build\u003c/th>\u003ctd>Engineering &amp; Dev\u003c/td>\u003ctd>Reviewed implementation, API contracts and CI evidence\u003c/td>\u003ctd>QA receives a testable build and environment; Operations receives deployment requirements.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">5. Validate\u003c/th>\u003ctd>Quality &amp; Testing + Product + Design\u003c/td>\u003ctd>Test evidence, defects, usability findings and acceptance decision\u003c/td>\u003ctd>Release owner assesses unresolved risks; a mock flow alone cannot establish production readiness.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">6. Release and support\u003c/th>\u003ctd>Engineering + Operations &amp; Support\u003c/td>\u003ctd>Release checklist, monitoring, rollback and support readiness\u003c/td>\u003ctd>Communication prepares approved customer updates and known-issue notes.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">7. Learn and improve\u003c/th>\u003ctd>Operations + Product Management + Communication\u003c/td>\u003ctd>Feedback, incidents, outcome measures and follow-up actions\u003c/td>\u003ctd>Return evidence to backlog prioritisation; changes enter through scope control.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"title":"Per-page team coverage","html":"\u003ch2>Apply this checklist to every page and journey\u003c/h2>\u003cp>Use the existing 43-page inventory and 10 journey checklists as the coverage baseline. For each page or cross-page flow, attach the six records below. Coverage status for all six functions is currently \u003cspan class=\"status\">Not reviewed\u003c/span>.\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Per-page product team coverage\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Review dimension\u003c/th>\u003cth scope=\"col\">Record for each page or journey\u003c/th>\u003cth scope=\"col\">Proposed review owner\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Product\u003c/th>\u003ctd>User problem, role, business rules, acceptance criteria, priority and success measure\u003c/td>\u003ctd>Product manager + Lead BA\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Design\u003c/th>\u003ctd>Wireframe/prototype, component states, accessibility, themes and responsive behaviour\u003c/td>\u003ctd>Designer\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Engineering\u003c/th>\u003ctd>UI/service ownership, API/data contracts, permission boundaries, persistence and technical dependencies\u003c/td>\u003ctd>Engineering lead\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Quality\u003c/th>\u003ctd>Requirement-linked cases, supported browsers, API checks, automated coverage and defect evidence\u003c/td>\u003ctd>QA lead\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Operations\u003c/th>\u003ctd>Failure detection, support article, incident owner, recovery and feedback intake\u003c/td>\u003ctd>Operations / support lead\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Communication\u003c/th>\u003ctd>Internal decision record, release-note impact and customer/support update needs\u003c/td>\u003ctd>Delivery / communication owner\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Record format:\u003c/strong> page/journey ID, function, named owner, requirement or outcome, deliverable/evidence link, status, dependencies, next action, review date and decision. Record an explicit reason for any not-applicable item.\u003c/p>\u003cp>\u003cstrong>Readiness rule:\u003c/strong> count only evidence-backed reviews as complete. Do not treat a populated checklist, a prototype or a successful build as proof of full product readiness.\u003c/p>"},{"title":"Cross-cutting checks","html":"\u003ch2>Shared surfaces and cross-cutting checks\u003c/h2>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Area reference table\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Area\u003c/th>\u003cth scope=\"col\">Checklist\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Navigation and nested screens\u003c/th>\u003ctd>Sidebar, profile menu, mode switch, breadcrumbs, back/forward, direct links, refresh and nested record selection. Confirm route reachability.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Additional route patterns\u003c/th>\u003ctd>Legacy /assessment-suite/blueprint alias; Student Management record paths and optional institution prefix in src/App.jsx. Nested records belong under Student Management, not extra registry pages.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Overlays and steps\u003c/th>\u003ctd>Inventory every tab, drawer, popup, wizard, preview and confirmation within each page; check open, close, cancel, Escape, focus trap/restore and scroll. This nested inventory is pending.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Data and persistence\u003c/th>\u003ctd>Static sample data, API boundaries, loading, empty/error states, validation, duplicate actions, retries, stale records and refresh recovery.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Roles and security\u003c/th>\u003ctd>Institution boundary, record ownership, view/edit/assign/evaluate/approve/release actions and denied access. Faculty/Student navigation modes do not grant permissions.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Design and accessibility\u003c/th>\u003ctd>Medsy tokens, labels, contrast, numeric alignment, table overflow, focus, keyboard, hover/press/loading/disabled states and reduced motion.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Responsive and themes\u003c/th>\u003ctd>Mobile 0?767px; tablet 768?1023px; desktop 1024?1439px; wide desktop 1440px+. Light/dark/OLED where supported; collapsed sidebar and overlays.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Shell utilities\u003c/th>\u003ctd>Notifications, fullscreen, theme, demo videos, profile settings, ID guide, sign-out and sample-account controls where present.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Recovery and history\u003c/th>\u003ctd>Cancellation, return for correction, resubmission, lock/unlock rules, failed writes, audit history and downstream consistency.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Report accuracy\u003c/th>\u003ctd>Counts, filters, denominators, released versus unreleased results, empty datasets and drill-down consistency.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"title":"Senior / Lead BA responsibilities","html":"\u003ch2>Senior / Lead Business Analyst responsibilities\u003c/h2>\u003cp>Responsibilities and required outputs for the later review. Owners, priorities, effort and budget remain unassigned until supported by evidence.\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Responsibility reference table\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Responsibility\u003c/th>\u003cth scope=\"col\">Required output\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Resolve ambiguity\u003c/th>\u003ctd>Decision log with rule, options, recommendation, owner and affected flows.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Maintain traceability\u003c/th>\u003ctd>Business objective ? requirement ? page/journey ? acceptance criteria ? evidence ? finding.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Validate roles\u003c/th>\u003ctd>Action matrix for view, create, edit, assign, evaluate, approve, release and administration; include negative access checks.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Protect baseline scope\u003c/th>\u003ctd>Record baseline version; separate defects, missing agreed requirements and proposed enhancements; require change-impact decisions.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Design strategic roadmap\u003c/th>\u003ctd>Sequence work by user impact, risk and dependencies; record outcomes, owners and release gates. No dates committed in this inventory.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Inform budget allocation\u003c/th>\u003ctd>Compare effort ranges, assumptions, expected value and operational cost; request agreed rates before monetary estimates. No budget committed.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Mentor junior analysts\u003c/th>\u003ctd>Provide example findings, reproducible steps and evidence standards; review analysis before sign-off.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Manage risks and dependencies\u003c/th>\u003ctd>Record severity, likelihood, affected roles, mitigation, dependency owner and unresolved decisions.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Recommend release readiness\u003c/th>\u003ctd>Use verified acceptance evidence and unresolved blockers; never infer production readiness from mock data or source presence.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"title":"Evidence and status rules","html":"\u003ch2>Evidence and status rules\u003c/h2>\u003cp>\u003cstrong>Verified for this inventory:\u003c/strong> registered labels and route mappings from \u003ccode>src/config/appPages.js\u003c/code> and \u003ccode>src/App.jsx\u003c/code>. Working behaviour, backend integration and production parity are outside this list-only pass.\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Status reference table\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Status\u003c/th>\u003cth scope=\"col\">Use when\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Not reviewed\u003c/th>\u003ctd>Evidence collection has not started. Current status for every page in this report.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">In review\u003c/th>\u003ctd>Inspection or testing is underway; no final conclusion.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Verified pass\u003c/th>\u003ctd>Defined acceptance checks passed; attach environment, date and evidence.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Partial\u003c/th>\u003ctd>Some checks passed, with explicitly listed gaps.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Failed\u003c/th>\u003ctd>A reproducible acceptance requirement failed.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Blocked\u003c/th>\u003ctd>A named requirement, access or dependency prevents verification.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Not applicable\u003c/th>\u003ctd>An item is excluded with a documented reason.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Each later finding should record: requirement ID, page and journey, role, expected behaviour, actual behaviour, reproduction steps, evidence, environment, source version, review date, severity, owner, decision and acceptance criteria.\u003c/p>\u003cp>\u003cstrong>Scope control:\u003c/strong> maintain the agreed baseline separately from proposed enhancements. This reference does not authorise fixes, releases or budget changes. It does not claim that all nested flows have already been discovered.\u003c/p>"}],"focus":{"Product Management":"Roadmaps, user research, feature backlogs and prioritization","UX/UI Design":"Wireframes, interactive prototypes and design systems","Engineering & Dev":"Source control, CI/CD pipelines and backend/frontend build","Quality & Testing":"Cross-browser testing, API validation and automated tests","Operations & Support":"Error tracking, customer feedback and help desks","Communication":"Async/sync team alignment and customer updates"},"mark":"\r\n\u003csvg version=\"1.1\" id=\"Layer_1\" xmlns=\"http://www.w3.org/2000/svg\" x=\"0px\" y=\"0px\"\r\n  viewBox=\"0 0 14 14\" style=\"enable-background:new 0 0 14 14;\" xml:space=\"preserve\">\r\n\u003cstyle type=\"text/css\">\r\n  .st0{fill:none;}\r\n  .st1{fill:#0E6844;}\r\n  .st2{fill:#5FE8B2;}\r\n\u003c/style>\r\n\u003ccircle class=\"st0\" cx=\"7\" cy=\"7\" r=\"6.9\"/>\r\n\u003cg>\r\n  \u003cpolygon class=\"st1\" points=\"6.3,3.3 4.8,3.3 2,10.7 3.6,10.7 5.5,5.4 7.4,10.7 8.9,10.7\"/>\r\n  \u003cpolygon class=\"st1\" points=\"7.7,3.3 9.1,3.3 12,10.7 10.5,10.7\"/>\r\n  \u003cpolygon class=\"st2\" points=\"7.7,3.3 7,5.2 7.5,6.8 8.3,5\"/>\r\n\u003c/g>\r\n\u003c/svg>\r\n","studentReview":{"revision":1,"date":"5 November 2026","pageId":"PAGE-040","flowId":"FLOW-001","serviceTests":46,"browserChecks":19,"functionality":"Partial","design":"Partial","scope":"Local source inspection, targeted service tests and read-only Chrome UI checks. No application fixes. No student data changes submitted.","conclusion":"The batch-to-roster-to-record path is working in the checked local sample. Production integration and full write-path verification remain open; one mobile search-layout issue was observed.","flows":[["Entry and batch overview","Browser checked","Sample overview: 4 batches, 17 studying students, 16 active, 9 backlog. Counts are fixture/date-specific."],["Create batch and academic calendar","Source + tests; form opened","Calendar validation, ordering and fourth-year length tests pass. Browser save/reload not exercised."],["Add student / advanced-year onboarding","Source + tests; form opened","Admission destination, identity, duplicate validation and stale saves covered in service tests; browser submission pending."],["Excel import","Source + tests; setup opened","Destination, sample template, analysis, preview and atomic validation present. Actual file upload/commit not browser-tested; 30-second minimum delay requires baseline confirmation."],["Year roster","Browser checked","Table waits for batch + study year; choosing both reveals matching rows. Multiple-batch/SGT permutations remain to test."],["Batch directory and selection","Browser checked","Batch opens directory; selecting a student shows bulk actions. Search/sort/pagination edge cases remain to test."],["Student record and return","Browser checked","Record route renders history; direct reload works; Back to batches restores batch directory (not overview)."],["Promotion / course completion","Source + service tests","Dates, eligibility, atomic missing-calendar rejection and Fourth Year completion covered. Browser commit pending."],["Repeat / wrong mapping","Source + service tests; form opened","Repeat preserves identity; wrong mapping issues a replacement identity and preserves prior ID. Browser commit pending."],["SGT / syllabus / account / photo","Source; selected service tests","SGT dialog opened; SGT and syllabus service coverage passes. Browser saves and photo processing not tested."],["Undo / corrections / history","Source + service tests","Stale change rejection, latest-decision checks and preservation of later profile edits tested. Full browser path pending."],["Delete student / batch","Source + service tests","Permission, empty-batch and migration guards plus partial deletion reporting tested. Destructive UI not submitted."],["Persistence and concurrency","Source inspected","IndexedDB transactions and initial backup; legacy localStorage read migration; lock and event/broadcast refresh. Browser write/recovery/cross-tab scenarios pending."],["Roles and downstream handoffs","Source inspected; integration pending","UI edit gates and mock service deny-by-default exist. Current shell user is Admin. Production role and faculty-assignment end-to-end checks remain open."]],"findings":[{"id":"SM-REV-01","title":"Review production API and permission integration","team":"Engineering & Dev","priority":"High","category":"Confirmed integration gap","detail":"studentManagement.js describes a mock adapter and requires production ownership/permission enforcement; App.jsx uses a fixed Admin profile. Define authenticated API contracts, server validation, organisation boundaries and rollout criteria. Do not treat the navigation mode switch as authorisation.","evidence":"Source confirmed; no production behaviour tested."},{"id":"SM-REV-02","title":"Resolve mobile batch-search field layout","team":"UX/UI Design","priority":"Medium","category":"Observed design issue","detail":"At 390px, open Student Management > Batch 2026. The search icon remains in the field but its placeholder is drawn below the field and partly clipped by the batch panel. Acceptance: icon, text and input fit inside one control with visible focus and no clipping at mobile widths. No fix performed.","evidence":"Observed in tmp/student-review-mobile.png; inspect StudentBatchWorkspace.css and inherited search styles."},{"id":"SM-REV-03","title":"Complete transactional Student Management browser coverage","team":"Quality & Testing","priority":"High","category":"Verification gap","detail":"In isolated test data, verify create/save/reload; valid and invalid Excel preview/commit; SGT save; promotion; repeat/mapping; undo/correction; account status; syllabus; deletion confirmation and partial failures; storage failure, stale requests and cross-tab updates. Check supported browsers and read-only roles.","evidence":"46 service tests passed; current browser review opened forms without submitting mutations."},{"id":"SM-REV-04","title":"Confirm calendar, completion and import-wait business rules","team":"Product Management","priority":"Medium","category":"Decision needed","detail":"Confirm current calendar rules (6-24 months with 18-month Fourth Year), Fourth Year course completion versus legacy Internship handling, identity replacement for wrong mapping, and mandatory minimum 30-second import analysis delay. Record approved baseline and acceptance rules; do not assume these behaviours are defects.","evidence":"Current calendar tests and StudentImport.jsx/source; legacy and version-4 completion paths differ intentionally in code but require a product baseline."},{"id":"SM-REV-05","title":"Define student-data recovery and support ownership","team":"Operations & Support","priority":"High","category":"Operational readiness gap","detail":"Document browser-local persistence limits, migration, storage quota/corruption response, recovery/export expectations, escalation owners and support guidance for wrong batch mapping and year-end decisions. Validate recovery before production rollout.","evidence":"IndexedDB retains current and before-first-save snapshots; this review did not exercise recovery UI or an operational runbook."},{"id":"SM-REV-06","title":"Prepare Student Management review and release communication","team":"Communication","priority":"Medium","category":"Handoff needed","detail":"Prepare an internal review summary separating verified service/browser checks, observed design findings, pending product decisions and untested paths. Any eventual customer release note must state confirmed scope and known issues and pass review before sending.","evidence":"Reference update only. No external updates sent."},{"id":"SM-REV-07","title":"Verify Student Management changes in downstream faculty assignments","team":"Quality & Testing","priority":"High","category":"Cross-module verification gap","detail":"Trace roster/calendar/SGT and status changes into faculty assignment eligibility, snapshots, Needs Review, refresh and history. Include same-tab, cross-tab and stale-save scenarios. Confirm Student Management remains the authoritative student/calendar source.","evidence":"Student directory emits change notifications; end-to-end faculty consumer behaviour was not tested in this pass."}],"checks":[{"label":"Sample batch overview loads","pass":true},{"label":"Add batch opens native dialog","pass":true},{"label":"Add student form opens","pass":true},{"label":"Roster waits for required context","pass":true},{"label":"Batch alone does not reveal roster","pass":true},{"label":"Batch plus study year reveals roster","pass":true},{"label":"Batch opens student directory","pass":true},{"label":"Selecting a student reveals bulk actions","pass":true},{"label":"SGT change form opens","pass":true},{"label":"Change batch distinguishes repeat from mapping correction","pass":true},{"label":"Import setup and sample template entry render","pass":true},{"label":"Student record route and year history render","pass":true},{"label":"Record survives direct-link reload","pass":true},{"label":"Record return restores batch directory","pass":true},{"label":"No document overflow in batch view at 390","pass":true},{"label":"No document overflow in batch view at 768","pass":true},{"label":"No document overflow in batch view at 1280","pass":true},{"label":"No document overflow in batch view at 1440","pass":true},{"label":"No browser runtime errors","pass":true}],"sources":["src/pages/StudentManagementPage.jsx","src/components/students/StudentDirectory.jsx","src/components/students/StudentRosterFilters.jsx","src/components/students/StudentImport.jsx","src/components/students/StudentRecord.jsx","src/components/students/StudentCalendarDialog.jsx","src/components/students/StudentWorkspacePanel.jsx","src/services/studentManagement.js","src/services/studentCalendarCommands.js","src/services/studentDirectoryStorage.js","src/App.jsx"],"artifacts":["tmp/student-flow-review-results.json","tmp/student-review-roster.png","tmp/student-review-mobile.png","tmp/student-review-record.png"],"command":"node --test --test-isolation=none src/services/studentManagement.test.js src/services/studentCalendar.test.js src/services/studentImport.test.js src/services/studentPromotionForm.test.js","fingerprints":[{"path":"src/pages/StudentManagementPage.jsx","sha256":"59b341c5bd3daafb6dbd2d85a3b65666083eb7f0573f2276aabbadfdb5d8a9d4"},{"path":"src/components/students/StudentDirectory.jsx","sha256":"b3db67e394f58ae8908098c648143131b3f86ec100ae96efbd4e4f33bad0a323"},{"path":"src/components/students/StudentRosterFilters.jsx","sha256":"6aa13ffedf37ffa2f21f1611d288c2e8e7f21ff826b78294224b7e397b143cef"},{"path":"src/components/students/StudentImport.jsx","sha256":"15d1cd62cb6d5130a0b5b41067ada805a8a9a573f7b9cd2b082a3a27661c21bd"},{"path":"src/components/students/StudentRecord.jsx","sha256":"3e0cd87418ee0e5c65eed1b3352ccaede2c7cd080ab3bfd0bb7b78a0ed90e092"},{"path":"src/components/students/StudentCalendarDialog.jsx","sha256":"bace48dc18a1436219664b69514e689252f3419237dc2b3718990800cf61680c"},{"path":"src/components/students/StudentWorkspacePanel.jsx","sha256":"d9697c8f0a5e5e284a68100100ed3383aa77c18d76eb9e05278a62de1e6fc8f6"},{"path":"src/services/studentManagement.js","sha256":"c3db10748b43882f1fe703259bfbb7d752add748865797edec8fb9bb4c477885"},{"path":"src/services/studentCalendarCommands.js","sha256":"82e0332ce1a15e4318dfa4a710d19b4400267199cc096b76dd66f8ed12e5da15"},{"path":"src/services/studentDirectoryStorage.js","sha256":"5091f565f3970207fbf33bc8 'use strict';
const SEED=JSON.parse(document.getElementById('seed-data').textContent);
const TEAMS=['Product Management','UX/UI Design','Engineering & Dev','Quality & Testing','Operations & Support','Communication'];
const STATUSES=['Not reviewed','Planned','In progress','Blocked','Done'];
const PRIORITIES=['Not set','High','Medium','Low'];
const VERDICTS=['Not reviewed','In review','Verified pass','Partial','Failed','Blocked','Not applicable'];
const KEY='medsy-product-workspace-v1';
const $=s=>document.querySelector(s), escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',list:'M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01',flow:'M5 3h6v6H5z M13 15h6v6h-6z M8 9v9h5',team:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 3a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',book:'M4 3h13a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3z M4 17h16 M8 7h8 M8 11h6',plus:'M12 5v14 M5 12h14'};

let tasks=structuredClone(SEED.tasks),activity=[],screen='student-review',view='table',query='',teamFilter='',statusFilter='',page=1,editing=null,returnFocus=null,toastTimer,storageOK=true;
function validate(data){if(!data||data.version!==1||!Array.isArray(data.tasks)||data.tasks.length>10000)throw Error('Choose a workspace backup with version 1 and a valid task list.');const ids=new Set();for(const t of data.tasks){if(!t||typeof t.id!=='string'||!t.id||ids.has(t.id)||typeof t.title!=='string'||!t.title.trim()||t.title.length>180||!TEAMS.includes(t.team)||!STATUSES.includes(t.status)||!PRIORITIES.includes(t.priority)||!VERDICTS.includes(t.verdict)||!['Page audit','Journey review','Team deliverable','Task'].includes(t.kind))throw Error('The backup contains an invalid or duplicate work item.');ids.add(t.id);for(const k of ['owner','due','description','evidence','source','module'])if(typeof t[k]!=='string'||t[k].length>12000)throw Error('The backup contains invalid task fields.');if(!t.description.trim()||!validDate(t.due))throw Error('The backup contains an invalid date or empty checklist.');if(['Verified pass','Partial','Failed','Not applicable'].includes(t.verdict)&&!t.evidence.trim())throw Error('Audit verdicts must include evidence.')}if(!Array.isArray(data.activity)||data.activity.length>100||data.activity.some(a=>!a||typeof a.text!=='string'||typeof a.time!=='string'||a.text.length>300||!Number.isFinite(Date.parse(a.time))))throw Error('Invalid activity history.');return data;}
function validDate(v){return v===''||(/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v))&&new Date(v).toISOString().slice(0,10)===v);}
try{const saved=localStorage.getItem(KEY);if(saved){const data=validate(JSON.parse(saved));tasks=data.tasks;activity=data.activity;}}catch(e){storageOK=false;$('#storage-banner').hidden=false;$('#storage-banner').textContent='Saved data could not be loaded. Starter items are shown; the existing stored copy will not be overwritten. Export this session to keep changes. '+e.message;}
function persist(){if(!storageOK)return false;try{localStorage.setItem(KEY,JSON.stringify({version:1,tasks,activity}));return true}catch(e){storageOK=false;$('#storage-banner').hidden=false;$('#storage-banner').textContent='Browser storage is unavailable. Changes remain in this session only. Export a backup before closing.';return false}}

// Merge new review evidence into an existing local workspace without replacing user assignments or notes.
if(SEED.studentReview){let changed=false;for(const fresh of SEED.tasks.filter(t=>t.id.startsWith('SM-REV-')||[SEED.studentReview.pageId,SEED.studentReview.flowId].includes(t.id))){const existing=tasks.find(t=>t.id===fresh.id);if(!existing){tasks.push(structuredClone(fresh));changed=true;}else if(existing.reviewRevision!==SEED.studentReview.revision&&!fresh.id.startsWith('SM-REV-')){existing.evidence=existing.evidence===fresh.evidence?existing.evidence:[existing.evidence,fresh.evidence].filter(Boolean).join('\n\n');if(existing.status==='Not reviewed')existing.status=fresh.status;if(existing.verdict==='Not reviewed')existing.verdict=fresh.verdict;existing.reviewRevision=SEED.studentReview.revision;changed=true;}}if(changed)persist();}

function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,5000)}
function log(text){activity.unshift({text,time:new Date().toISOString()});activity=activity.slice(0,30)}
const statusBadge=s=>'<span class="status '+(s==='Done'?'done':s==='Blocked'?'blocked':'')+'">'+escapeHtml(s)+'</span>';
const opt=(values,value,empty)=> (empty?'<option value="">'+empty+'</option>':'')+values.map(v=>'<option value="'+escapeHtml(v)+'"'+(value===v?' selected':'')+'>'+escapeHtml(v)+'</option>').join('');
function title(){return screen==='student-review'?'Student Management review':screen==='overview'?'Project overview':screen==='all'?'All work':screen==='pages'?'Page audits':screen==='flows'?'End-to-end flows':screen==='guide'?'Team playbook':screen;}
function sidebar(){const nav=(id,label,i,count)=>'<button class="nav-button '+(screen===id?'active':'')+'" data-nav="'+escapeHtml(id)+'"'+(screen===id?' aria-current="page"':'')+'>'+icon(i)+escapeHtml(label)+(count!==undefined?'<span class="nav-count">'+count+'</span>':'')+'</button>';$('#sidebar').innerHTML='<div class="brand">'+SEED.mark+'<div><div class="workspace-label">Product workspace</div><small>Medsy / internal</small></div></div><nav aria-label="Project"><div class="nav-label">Workspace</div>'+nav('overview','Overview','overview')+nav('all','All work','list',tasks.length)+nav('pages','Page audits','book',tasks.filter(t=>t.kind==='Page audit').length)+nav('flows','End-to-end flows','flow',tasks.filter(t=>t.kind==='Journey review').length)+'<div class="nav-label">Product teams</div>'+TEAMS.map(t=>nav(t,t,'team',tasks.filter(x=>x.team===t).length)).join('')+'<div class="nav-label">Reference</div>'+nav('student-review','Student review','book')+nav('guide','Team playbook','book')+'</nav><div class="sidebar-footer"><strong>Local workspace</strong><p>Changes stay in this browser.<br>Export a backup to move or share them.</p><p>Audit baseline: 5 Nov 2026</p></div>';}
function navigate(id){screen=id;query='';teamFilter='';statusFilter='';page=1;$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');render();$('#page-title').focus();}
function scoped(){return tasks.filter(t=>screen==='pages'?t.kind==='Page audit':screen==='flows'?t.kind==='Journey review':TEAMS.includes(screen)?t.team===screen:true)}
function filtered(){return scoped().filter(t=>(!query||(t.title+' '+t.id+' '+t.owner+' '+t.module+' '+t.description).toLowerCase().includes(query.toLowerCase().trim()))&&(!teamFilter||t.team===teamFilter)&&(!statusFilter||t.status===statusFilter))}
function taskButton(t){return '<button class="task-name" data-task="'+escapeHtml(t.id)+'">'+escapeHtml(t.title)+'</button><small class="task-id">'+escapeHtml(t.id)+' / '+escapeHtml(t.module||t.kind)+'</small>'}
function rows(items){return items.map(t=>'<tr><td>'+taskButton(t)+'</td><td>'+escapeHtml(t.team)+'</td><td>'+statusBadge(t.status)+'</td><td>'+escapeHtml(t.owner||'Unassigned')+'</td><td class="priority">'+escapeHtml(t.priority)+'</td><td class="mono">'+escapeHtml(t.due||'No date')+'</td><td>'+escapeHtml(t.verdict)+'</td></tr>').join('')}
function table(items){return '<div class="table-wrap" tabindex="0" role="region" aria-label="Work items"><table><thead><tr><th scope="col">Work item</th><th scope="col">Team</th><th scope="col">Work status</th><th scope="col">Owner</th><th scope="col">Priority</th><th scope="col">Due date</th><th scope="col">Audit verdict</th></tr></thead><tbody>'+rows(items)+'</tbody></table></div>'}
function overview(){const done=tasks.filter(t=>t.status==='Done').length,unassigned=tasks.filter(t=>!t.owner).length,blocked=tasks.filter(t=>t.status==='Blocked').length;const focus=tasks.filter(t=>t.status!=='Done').sort((a,b)=>(a.status==='Blocked'?-1:0)-(b.status==='Blocked'?-1:0)||(a.priority==='High'?-1:0)-(b.priority==='High'?-1:0)).slice(0,4);return '<div class="metrics">'+[['Work items',tasks.length,'Across six product functions'],['Completed',done,'Work status, not audit approval'],['Unassigned',unassigned,'Set an accountable owner'],['Blocked',blocked,'Decisions or dependencies needed']].map(m=>'<div class="metric"><small>'+m[0]+'</small><strong>'+m[1]+'</strong><small>'+m[2]+'</small></div>').join('')+'</div><div class="overview-grid"><section class="panel"><div class="panel-head"><div><h2>Team workload</h2><small>Completed / total work items</small></div><button class="text-button" data-nav="all">View all work</button></div>'+TEAMS.map(team=>{const total=tasks.filter(t=>t.team===team).length,n=tasks.filter(t=>t.team===team&&t.status==='Done').length;return '<button class="team-row" data-nav="'+escapeHtml(team)+'"><span>'+escapeHtml(team)+'<small>'+tasks.filter(t=>t.team===team&&!t.owner).length+' unassigned</small></span><span class="track"><span class="fill" style="display:block;width:'+(total?n/total*100:0)+'%"></span></span><span class="mono">'+n+'/'+total+'</span></button>'}).join('')+'</section><section class="panel"><div class="panel-head"><div><h2>Ready to organise</h2><small>Blocked and high-priority items appear first</small></div></div>'+focus.map(t=>'<button class="focus-item" data-task="'+escapeHtml(t.id)+'"><small class="mono">'+escapeHtml(t.id)+' / '+escapeHtml(t.status)+'</small><strong>'+escapeHtml(t.title)+'</strong><small>'+escapeHtml(t.owner||'Unassigned')+' / '+escapeHtml(t.team)+'</small></button>').join('')+(!focus.length?'<p class="empty">All work items are marked done.</p>':'')+'</section></div><div class="section-title"><h2>Page review queue</h2><button class="text-button" data-nav="pages">View all page audits</button></div>'+table(tasks.filter(t=>t.kind==='Page audit').slice(0,5))+'<div class="section-title"><h2>Recent activity</h2><small>Local changes only</small></div><div class="panel">'+(activity.length?activity.slice(0,4).map(a=>'<div class="focus-item"><strong>'+escapeHtml(a.text)+'</strong><small>'+escapeHtml(new Date(a.time).toLocaleString())+'</small></div>').join(''):'<p class="empty">No changes yet. Open a work item to assign an owner and plan the next step.</p>')+'</div>';}
function toolbar(){return '<div class="toolbar"><input class="search" id="search" type="search" aria-label="Search work items" placeholder="Search work items, owners or modules" value="'+escapeHtml(query)+'"><select id="team-filter" aria-label="Filter by team">'+opt(TEAMS,teamFilter,'All teams')+'</select><select id="status-filter" aria-label="Filter by status">'+opt(STATUSES,statusFilter,'All statuses')+'</select><button id="clear-filters">Clear</button><div class="segmented" aria-label="Work view"><button data-view="table" aria-pressed="'+(view==='table')+'">Table</button><button data-view="board" aria-pressed="'+(view==='board')+'">Board</button></div></div><div id="work-results"></div>';}
function results(){const items=filtered(),size=20,total=Math.max(1,Math.ceil(items.length/size));page=Math.min(page,total);let body='';if(!items.length)body='<div class="panel empty"><h2>No matching work items</h2><p>Clear the filters or create a new work item.</p></div>';else if(view==='table')body=table(items.slice((page-1)*size,page*size));else body='<div class="board" tabindex="0" role="region" aria-label="Work status board">'+STATUSES.map(s=>{const group=items.filter(t=>t.status===s);return '<section class="column"><h3>'+escapeHtml(s)+' <span class="mono">'+group.length+'</span></h3>'+group.map(t=>'<button class="task-card" data-task="'+escapeHtml(t.id)+'"><small class="mono">'+escapeHtml(t.id)+'</small><strong>'+escapeHtml(t.title)+'</strong><small>'+escapeHtml(t.team)+'</small><div class="card-foot"><small>'+escapeHtml(t.owner||'Unassigned')+'</small><small>'+escapeHtml(t.priority)+'</small></div></button>').join('')+(!group.length?'<p class="empty">No work items</p>':'')+'</section>'}).join('')+'</div>';body+='<div class="list-footer"><span role="status">'+items.length+' matching work items'+(view==='table'?' / page '+page+' of '+total:'')+'</span>'+(view==='table'?'<div><button id="prev" '+(page===1?'disabled':'')+'>Previous</button> <button id="next" '+(page===total?'disabled':'')+'>Next</button></div>':'<small>Open a card to change its status.</small>')+'</div>';$('#work-results').innerHTML=body;}
function guide(){return '<div class="team-brief"><h2>How this workspace works</h2><p>The page inventory comes from the local app registry. Team deliverables and journey checklists are proposed work, not completed audits. Owners, priorities and dates start unassigned. Use work status for delivery progress and audit verdict for evidence-backed conclusions.</p><p>This file has no accounts, server sync or shared live editing. Export/import moves a snapshot; imports replace this local workspace after confirmation.</p></div><div class="reference-list">'+SEED.guides.map(g=>'<details><summary>'+escapeHtml(g.title)+'</summary>'+g.html+'</details>').join('')+'</div>';}
function studentReview(){const r=SEED.studentReview;const tableFor=(headers,rows)=>'<div class="table-wrap" tabindex="0" role="region" aria-label="Student flow review"><table><thead><tr>'+headers.map(h=>'<th scope="col">'+escapeHtml(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(cell=>'<td>'+escapeHtml(cell)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';return '<div class="team-brief"><h2>'+escapeHtml(r.conclusion)+'</h2><p>'+escapeHtml(r.scope)+'</p><p>Reviewed '+escapeHtml(r.date)+' / snapshot hashes recorded below. Work status is tracked separately from this dated review.</p><button class="text-button" data-task="'+r.pageId+'">Open Student Management work item</button></div><div class="metrics">'+[['Functionality',r.functionality],['Design',r.design],['Service tests',r.serviceTests+'/'+r.serviceTests],['Browser checks',r.browserChecks+'/'+r.browserChecks]].map(v=>'<div class="metric"><small>'+v[0]+'</small><strong style="font-size:20px">'+v[1]+'</strong></div>').join('')+'</div><div class="section-title"><h2>End-to-end flow coverage</h2><small>Verified paths and explicit gaps</small></div>'+tableFor(['Stage','Verification','Finding / remaining coverage'],r.flows)+'<div class="section-title"><h2>Findings and team follow-ups</h2><small>No fixes performed</small></div><div class="reference-list">'+r.findings.map(f=>'<details><summary>'+escapeHtml(f.id+' / '+f.category+' / '+f.title)+'</summary><p>'+escapeHtml(f.detail)+'</p><p><strong>Evidence:</strong> '+escapeHtml(f.evidence)+'</p><p>'+escapeHtml(f.team+' / proposed priority: '+f.priority+' / owner unassigned')+'</p><button class="text-button" data-task="'+escapeHtml(f.id)+'">Open follow-up work item</button></details>').join('')+'</div><div class="section-title"><h2>Review evidence</h2></div><div class="reference-list"><details><summary>19 read-only browser checks</summary><ul>'+r.checks.map(c=>'<li>'+escapeHtml(c.label)+' - '+(c.pass?'Passed':'Failed')+'</li>').join('')+'</ul></details><details><summary>Service tests, source snapshots and captures</summary><p><code>'+escapeHtml(r.command)+'</code></p><ul>'+r.fingerprints.map(s=>'<li>'+escapeHtml(s.path)+'<code>'+escapeHtml(s.sha256)+'</code></li>').join('')+'</ul><p>Capture paths are local evidence references:</p><ul>'+r.artifacts.map(a=>'<li><code>'+escapeHtml(a)+'</code></li>').join('')+'</ul></details><details><summary>Design assessment limits</summary><p>Desktop roster and mobile batch screenshots inspected. No document overflow at 390, 768, 1280 or 1440px in the batch view. The mobile search control is visibly misaligned/clipped; record SM-REV-02 tracks this. Dark/OLED, full keyboard navigation, contrast and cross-browser behaviour were not audited. A layout pass does not establish accessibility compliance.</p></details></div>';}

function render(){sidebar();$('#breadcrumb').textContent=title();const desc=screen==='student-review'?'First module review: findings, evidence and follow-up work across the product team.':screen==='overview'?'One place to organise Medsy page reviews, product work and team handoffs.':screen==='pages'?'43 registered pages form the review baseline. Functionality and design checks are inside each work item.':screen==='flows'?'Trace cross-page journeys, exceptions and ownership from entry to completion.':screen==='guide'?'Responsibilities, deliverables and evidence rules for the product team.':TEAMS.includes(screen)?SEED.focus[screen]:'Plan and track work across every product function.';$('#content').innerHTML='<div class="heading"><div><h1 id="page-title" tabindex="-1">'+escapeHtml(title())+'</h1><p>'+escapeHtml(desc)+'</p></div><button class="primary" id="new-task">'+icon('plus')+'New work item</button></div>'+(screen==='overview'?'<p class="scope-note">Reference workspace only. No application fixes or verified production claims. Changes are saved locally when browser storage is available.</p>':'')+(screen==='student-review'?studentReview():screen==='overview'?overview():screen==='guide'?guide():toolbar());if(!['overview','guide','student-review'].includes(screen))results();}
function openTask(id){returnFocus=document.activeElement;editing=id||null;const t=id?tasks.find(t=>t.id===id):{title:'',team:TEAMS.includes(screen)?screen:'Product Management',status:'Not reviewed',owner:'',priority:'Not set',due:'',verdict:'Not reviewed',description:'',evidence:'',source:''};if(!t)return;const f=$('#task-form');f.elements.team.innerHTML=opt(TEAMS,t.team);f.elements.status.innerHTML=opt(STATUSES,t.status);f.elements.priority.innerHTML=opt(PRIORITIES,t.priority);f.elements.verdict.innerHTML=opt(VERDICTS,t.verdict);for(const k of ['title','owner','due','description','evidence'])f.elements[k].value=t[k];$('#dialog-id').textContent=id||'NEW WORK ITEM';$('#dialog-title').textContent=id?'Work item details':'Create work item';$('#task-source').textContent=t.source?'Source: '+t.source:'Local workspace task';$('#form-error').textContent='';$('#task-dialog').showModal();document.body.style.overflow='hidden';f.elements.title.focus();}
$('#task-dialog').addEventListener('close',()=>{document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus();else $('#page-title').focus()});
function closeTask(){ $('#task-dialog').close(); }
$('#close-dialog').onclick=closeTask;$('#cancel-dialog').onclick=closeTask;
$('#task-form').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget;const values=Object.fromEntries(new FormData(form));for(const k of Object.keys(values))values[k]=values[k].trim();if(!values.title||!values.description){$('#form-error').textContent='Enter a title and a scope / acceptance checklist.';return}if(!validDate(values.due)){ $('#form-error').textContent='Enter a valid due date.';return}if(['Verified pass','Partial','Failed','Not applicable'].includes(values.verdict)&&!values.evidence){$('#form-error').textContent='Add evidence or a documented reason before choosing this audit verdict.';form.elements.evidence.focus();return}if(editing){tasks=tasks.map(t=>t.id===editing?{...t,...values}:t);log('Updated '+editing+': '+values.title)}else{const id='WORK-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();tasks.unshift({id,...values,kind:'Task',source:'',module:'Custom work'});log('Created '+id+': '+values.title)}const saved=persist();closeTask();render();notify(saved?'Work item saved in this browser.':'Work item saved for this session. Export a backup to keep it.');});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const item=e.target.closest('[data-task]');if(item){openTask(item.dataset.task);return}const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render();return}if(e.target.closest('#new-task'))openTask();if(e.target.closest('#clear-filters')){query='';teamFilter='';statusFilter='';page=1;render()}if(e.target.closest('#prev')){page--;results()}if(e.target.closest('#next')){page++;results()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;page=1;results()}});document.addEventListener('change',e=>{if(e.target.id==='team-filter'){teamFilter=e.target.value;page=1;results()}if(e.target.id==='status-filter'){statusFilter=e.target.value;page=1;results()}});
$('#menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open));$('#menu').setAttribute('aria-label',open?'Close navigation':'Open navigation')};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open')){$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#menu').focus()}});
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,tasks,activity},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='medsy-product-workspace-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Workspace backup exported.')};
$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('Backup must be smaller than 5 MB.');const data=validate(JSON.parse(await file.text()));if(!confirm('Replace all '+tasks.length+' current work items with '+data.tasks.length+' imported items? Export first if you need a backup.'))return;tasks=data.tasks;activity=data.activity;log('Imported '+tasks.length+' work items');const saved=persist();render();notify(saved?'Backup imported and saved.':'Backup imported for this session; export to keep changes.')}catch(error){notify('Import failed: '+error.message)}finally{e.target.value=''}};
render();
</script></body></html>
