name: Update Linear commit history document

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-history-main
  cancel-in-progress: false

jobs:
  document:
    if: github.ref == 'refs/heads/main' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh the Medsy_UI document
        env:
          LINEAR_API_KEY: ${{ secrets.MEDSY_UI_LINEAR_API_KEY }}
          LINEAR_TEAM_ID: 8acbfb6e-79e3-4f8a-9f89-27f89d1f7f18
          LINEAR_HISTORY_DOCUMENT_ID: 22c6599f-60ee-434a-a3b6-ba0efc5df627
        run: node "linear automation/linear-commit-history.mjs"
