name: Create Linear review task for main push

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linear-review:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create one Medsy_UI task for this push
        env:
          LINEAR_API_KEY: ${{ secrets.MEDSY_UI_LINEAR_API_KEY }}
          LINEAR_TEAM_ID: 8acbfb6e-79e3-4f8a-9f89-27f89d1f7f18
          LINEAR_REVIEW_STATE_ID: 92c4acd0-02da-4852-936c-c9d368b95fa5
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/linear-main-push.mjs
