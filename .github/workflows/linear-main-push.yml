name: Record Linear UI update for main push

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linear-update:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create one Medsy_UI task for this push
        env:
          LINEAR_API_KEY: ${{ secrets.MEDSY_UI_LINEAR_API_KEY }}
          LINEAR_TEAM_ID: 8acbfb6e-79e3-4f8a-9f89-27f89d1f7f18
          LINEAR_DONE_STATE_ID: d79d5f48-1069-4a70-8674-d9cc495d1cba
          LINEAR_ASSIGNEE_ID: 8177a4ee-a534-4a88-a501-c2f77a0ad18e
          LINEAR_LABEL_ID: 940d24c0-46af-4ab3-a717-b747967c8d04
          GITHUB_TOKEN: ${{ github.token }}
        run: node "linear automation/linear-main-push.mjs"
