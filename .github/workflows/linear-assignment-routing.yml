name: Move my Medsy assignments to Medsy_UI

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linear-assignment-routing
  cancel-in-progress: false

jobs:
  route:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out routing script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Move active issues assigned to Sathish
        env:
          LINEAR_API_KEY: ${{ secrets.MEDSY_UI_LINEAR_API_KEY }}
          LINEAR_SOURCE_TEAM_ID: 308e1550-2a4b-4cb7-b3e4-f4c8a112517f
          LINEAR_DESTINATION_TEAM_ID: 8acbfb6e-79e3-4f8a-9f89-27f89d1f7f18
          LINEAR_ASSIGNEE_ID: 8177a4ee-a534-4a88-a501-c2f77a0ad18e
        run: node .github/scripts/linear-assignment-routing.mjs
